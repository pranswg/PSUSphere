{% extends 'base.html' %}
{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Colleges</h4>
        <div class="card">
            <div class="card-header"><div class="card-title">List of Colleges</div></div>
            <div class="card-body">
                <a href="{% url 'college-add' %}" class="btn btn-success btn-rounded">Add College</a>
                <table class="table table-striped mt-3">
                    <thead>
                        <tr>
                            <th>College Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for object in object_list %}
                        <tr>
                            <td>{{ object.college_name }}</td>
                            <td>
                                <a href="{% url 'college-update' object.id %}">Edit</a>
                                <a href="{% url 'college-delete' object.id %}" class="text-danger">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="2" class="text-center">No Records Found</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% include 'includes/pagination.html' %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
